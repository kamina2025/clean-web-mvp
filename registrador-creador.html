<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructor de Páginas - Web Limpia</title>
  <style>
    :root {
      --primary: #00d2ff;
      --primary-dark: #0072ff;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 750px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 25px;
      border: 1px solid #334155;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.99);
    }

    .code-box {
      background-color: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      width: auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      background: #334155;
    }

    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌐 Constructor Web Limpia</h1>
    <p style="color: var(--text-muted)">Monetiza tu contenido con micropagos transparentes en Nano (XNO) sin rastreo ni anuncios.</p>
  </div>

  <div class="card">
    <form id="builderForm">
      <div class="form-group">
        <label for="title">Título del Artículo / Sitio Web</label>
        <input type="text" id="title" placeholder="Ej. Guía sobre Inteligencia Artificial y Privacidad" required>
      </div>

      <div class="form-group">
        <label for="url">URL Completa del Sitio</label>
        <input type="url" id="url" placeholder="https://tuweb.com/articulo-1" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category">
            <option value="Tecnología">Tecnología</option>
            <option value="Periodismo">Periodismo</option>
            <option value="Arte">Arte y Cultura</option>
            <option value="Ciencia">Ciencia y Educación</option>
            <option value="Música">Música</option>
            <option value="Video">Video</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nanoAddress">Dirección Pública Nano (XNO Wallet)</label>
          <input type="text" id="nanoAddress" placeholder="nano_1... o nano_3..." required pattern="^nano_[13][13456789abcdefghijkmnopqrstuwxyz]{59}$" title="Ingresa una dirección pública Nano válida">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="minSeconds">Tiempo Mínimo de Atención (Segundos)</label>
          <input type="number" id="minSeconds" value="15" min="3" max="300" required>
        </div>

        <div class="form-group">
          <label for="rateXNO">Tarifa Sugerida (XNO)</label>
          <input type="number" id="rateXNO" value="0.0001" step="0.000001" min="0.000001" required>
        </div>
      </div>

      <button type="submit" id="btnSubmit">🚀 Registrar e Indexar Página</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="card" id="outputCard" style="display: none;">
    <h2>📋 ¡Página Indexada con Éxito!</h2>
    <p style="color: var(--text-muted)">Copia y pega el siguiente código dentro del <code>&lt;head&gt;</code> o antes de cerrar el <code>&lt;/body&gt;</code> en el código HTML de tu sitio web:</p>

    <div class="form-group">
      <label>Opción A: Metadatos del Manifiesto Web Limpia (Inseparable / Transparente)</label>
      <div class="code-box">
        <button class="btn-copy" onclick="copyCode('codeMeta')">Copiar</button>
        <code id="codeMeta"></code>
      </div>
    </div>

    <div class="form-group" style="margin-top: 25px;">
      <label>Opción B: Script Interactivo + Widget de Atención en Pantalla (Opcional)</label>
      <div class="code-box">
        <button class="btn-copy" onclick="copyCode('codeWidget')">Copiar</button>
        <code id="codeWidget"></code>
      </div>
    </div>
  </div>
</div>

<script>
  // Reemplaza con la URL desplegada de tu Google Apps Script
  const GOOGLE_SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycby3grmQt_RJ5_jFQcPBkudqAYSlSq6Z4XBQAvuwxt212emBc5TyTYiBKH-d27fqJ9iwfw/exec";

  document.getElementById('builderForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMsg = document.getElementById('statusMsg');
    
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Indexando página...";
    statusMsg.style.display = "none";

    const payload = {
      action: "register_site",
      title: document.getElementById('title').value.trim(),
      url: document.getElementById('url').value.trim(),
      category: document.getElementById('category').value,
      nano_address: document.getElementById('nanoAddress').value.trim(),
      min_seconds: parseInt(document.getElementById('minSeconds').value),
      rate_xno: parseFloat(document.getElementById('rateXNO').value)
    };

    try {
      // 1. Registrar en la base de datos centralizada (Google Sheets)
      if (GOOGLE_SHEET_ENDPOINT && !GOOGLE_SHEET_ENDPOINT.includes("AQUÍ_PEGA")) {
        await fetch(GOOGLE_SHEET_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      // 2. Generar el código snippet del Manifiesto HTML (<meta> tags)
      const snippetMeta = 
`<meta name="cleanweb:enabled" content="true">
<meta name="cleanweb:address" content="${payload.nano_address}">
<meta name="cleanweb:rate" content="${payload.rate_xno}">
<meta name="cleanweb:time" content="${payload.min_seconds}">
<meta name="cleanweb:title" content="${payload.title}">`;

      // 3. Generar el Script embebible con Widget Visual de Atención
      const snippetWidget = 
`<script>
  window.cleanweb = {
    address: "${payload.nano_address}",
    rate: ${payload.rate_xno},
    time: ${payload.min_seconds}
  };
<\/script>
<script src="https://cdn.jsdelivr.net/gh/tu-usuario/clean-web-mvp/widget.js" async><\/script>`;

      document.getElementById('codeMeta').textContent = snippetMeta;
      document.getElementById('codeWidget').textContent = snippetWidget;
      document.getElementById('outputCard').style.display = 'block';

      statusMsg.className = "status-msg status-success";
      statusMsg.innerText = "✅ Página indexada en la base de datos de la Web Limpia.";
      statusMsg.style.display = "block";

    } catch (err) {
      console.error(err);
      statusMsg.className = "status-msg status-error";
      statusMsg.innerText = "⚠️ Hubo un detalle al enviar a la BD, pero tu código se generó correctamente abajo.";
      statusMsg.style.display = "block";
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "🚀 Registrar e Indexar Página";
    }
  });

  function copyCode(elementId) {
    const text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert("¡Código copiado al portapapeles!");
    });
  }
</script>

</body>
</html>
