<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Experimento 3: Reproductor de Música</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: white; padding: 40px; text-align: center; }
    .track-list { max-width: 500px; margin: 20px auto; text-align: left; }
    .track-item { background: #1f2937; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .play-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
    .status-music { margin-top: 20px; color: #10b981; }
  </style>
</head>
<body>
  <h1>🎵 Streaming de Audio por Pista</h1>
  <p>Escucha música independiente con micro-pagos directos al artista.</p>

  <div class="track-list">
    <div class="track-item">
      <div>
        <strong>Canción 1: Eco Digital</strong><br>
        <small style="color: #9ca3af;">Tarifa: 0.0001 XNO</small>
      </div>
      <button class="play-btn" onclick="reproducirPista('Eco Digital', 0.0001, 'audio1')">▶️ Play</button>
    </div>
    <div class="track-item">
      <div>
        <strong>Canción 2: Ritmo de Bloques</strong><br>
        <small style="color: #9ca3af;">Tarifa: 0.00015 XNO</small>
      </div>
      <button class="play-btn" onclick="reproducirPista('Ritmo de Bloques', 0.00015, 'audio2')">▶️ Play</button>
    </div>
  </div>

  <audio id="audio1" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  <audio id="audio2" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>

  <div class="status-music" id="musicStatus">Selecciona una canción para escuchar.</div>

  <script>
  const CREADOR_NANO = "nano_1r9hnf3zagcruh4k8gfp8izf1c67f3codi1xsxiochokg9xdstfrm6nc4o6d";
  let audioPistaPendiente = null;

  function reproducirPista(nombre, precio, audioId) {
    if (audioPistaPendiente) audioPistaPendiente.pause();
    
    audioPistaPendiente = document.getElementById(audioId);
    document.getElementById('musicStatus').innerText = `⏳ Pagando ${precio} XNO para escuchar "${nombre}"...`;

    window.postMessage({
      type: "CLEANWEB_MICROPAGO_TRIGGER",
      direccionDestino: CREADOR_NANO,
      montoXNO: precio,
      concepto: `Música: ${nombre}`
    }, "*");
  }

  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "CLEANWEB_PAGO_RESPUESTA") {
      const statusDiv = document.getElementById('musicStatus');
      if (event.data.exito && audioPistaPendiente) {
        audioPistaPendiente.play();
        statusDiv.innerText = `🎶 Reproduciendo pista (Pago de ${event.data.hash.substring(0, 10)}... validado).`;
      } else {
        statusDiv.innerText = `❌ No se pudo reproducir la pista: ${event.data.error}`;
      }
    }
  });
</script>
</body>
</html>
