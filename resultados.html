<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados - Buscador Web Limpia</title>
  <style>
    :root {
      --primary: #0070f3;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text);
      text-decoration: none;
    }

    .search-box {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 500px;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: var(--text);
    }

    .btn-search {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-index {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      white-space: nowrap;
    }

    .results-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .result-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      border: 1px solid #334155;
    }

    .result-title {
      font-size: 1.25rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-desc {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .result-meta {
      display: flex;
      gap: 15px;
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: var(--accent);
    }

    /* Tarjeta CTA de Indexación en Resultados */
    .cta-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cta-info h4 {
      margin: 0 0 0.5rem 0;
      color: var(--accent);
    }

    .cta-info p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .loading-text {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="index.html" class="logo">🌐 Web Limpia</a>
    <form action="resultados.html" method="GET" class="search-box">
      <input type="text" id="searchInput" name="q" placeholder="Buscar..." required>
      <button type="submit" class="btn-search">Buscar</button>
    </form>
    <a href="registrador-creador.html" class="btn-index">➕ Indexar mi página</a>
  </div>

  <div class="results-container">
    <h3 id="queryTitle">Resultados de búsqueda:</h3>
    
    <div id="resultsList">
      <p class="loading-text">⌛ Conectando con el indexador de Google Sheets...</p>
    </div>

    <div class="cta-card">
      <div class="cta-info">
        <h4>¿No encuentras tu sitio web aquí?</h4>
        <p>Añade los metadatos de micropagos Nano a tu web y regístrala gratis en el indexador.</p>
      </div>
      <a href="registrador-creador.html" class="btn-index">⚡ Indexar Sitio Web</a>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON LA URL WEB APP DE TU DESPLIEGUE EN GOOGLE APPS SCRIPT
    const GOOGLE_SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycby3grmQt_RJ5_jFQcPBkudqAYSlSq6Z4XBQAvuwxt212emBc5TyTYiBKH-d27fqJ9iwfw/exec";

    // Experimentos locales predeterminados para asegurar disponibilidad durante demos
    const localExperiments = [
      {
        title: "Experimento 1: Video con Cobro por Clic",
        url: "experimento_video.html",
        desc: "Prueba la interacción de micropago automático al reproducir o interactuar con contenido en video.",
        category: "Video / Streaming"
      },
      {
        title: "Experimento 2: Galería de Fotos (Likes y Propinas)",
        url: "experimento_galeria.html",
        desc: "Galería fotográfica interactiva con botones para enviar super-likes o propinas usando Nano.",
        category: "Arte / Imágenes"
      },
      {
        title: "Experimento 3: Reproductor de Música (Micro-streaming)",
        url: "experimento_musica.html",
        desc: "Escucha canciones con micropago instantáneo al dar play por tiempo de reproducción.",
        category: "Música / Audio"
      }
    ];

    // 1. Obtener término de búsqueda de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const query = (urlParams.get('q') || '').trim().toLowerCase();
    
    document.getElementById('searchInput').value = query;
    document.getElementById('queryTitle').innerText = query 
      ? `Resultados para: "${query}"` 
      : 'Todos los contenidos indexados:';

    const resultsList = document.getElementById('resultsList');

    // 2. Función principal para consultar Google Sheets y renderizar
    async function loadResults() {
      let remoteSites = [];

      try {
        if (GOOGLE_SHEET_ENDPOINT && !GOOGLE_SHEET_ENDPOINT.includes("TU_SCRIPT_ID_AQUI")) {
          const response = await fetch(GOOGLE_SHEET_ENDPOINT);
          if (response.ok) {
            const data = await response.json();
            // Mapear campos devueltos por Apps Script
            remoteSites = (Array.isArray(data) ? data : data.sites || []).map(site => ({
              title: site.title || site.titulo || 'Sin Título',
              url: site.url_google_site || site.url || '#',
              desc: site.description || site.categoria || `Categoría: ${site.category || 'General'}`,
              category: site.category || 'Web Limpia',
              rate: site.rate_xno || site.rate || null
            }));
          }
        }
      } catch (error) {
        console.warn("No se pudo obtener datos en vivo de Google Sheets, mostrando lista local:", error);
      }

      // Combinar datos locales con los traídos desde la base de datos
      const dataset = [...remoteSites, ...localExperiments];

      // Filtrar resultados por el término de búsqueda
      const filtered = dataset.filter(item => 
        !query || 
        item.title.toLowerCase().includes(query) || 
        item.desc.toLowerCase().includes(query) ||
        (item.category && item.category.toLowerCase().includes(query))
      );

      // Renderizar tarjetas de resultados
      resultsList.innerHTML = '';

      if (filtered.length > 0) {
        filtered.forEach(item => {
          const metaBadge = item.rate ? `<span>⚡ Tarifa: ${item.rate} XNO</span>` : '';
          const categoryBadge = item.category ? `<span>📁 ${item.category}</span>` : '';

          resultsList.innerHTML += `
            <div class="result-card">
              <a href="${item.url}" class="result-title">${item.title}</a>
              <p class="result-desc">${item.desc}</p>
              <div class="result-meta">
                ${categoryBadge}
                ${metaBadge}
              </div>
            </div>
          `;
        });
      } else {
        resultsList.innerHTML = `<p style="color: var(--text-muted)">No se encontraron contenidos que coincidan con la búsqueda "${query}".</p>`;
      }
    }

    // Ejecutar carga al iniciar
    loadResults();
  </script>

</body>
</html>
