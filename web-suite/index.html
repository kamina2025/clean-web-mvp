<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador - Web Limpia</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    h1 { color: #0e86d4; font-size: 2.5rem; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; width: 90%; max-width: 500px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #0e86d4; }
    button { padding: 12px 24px; background: #0e86d4; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #0b68a4; }
  </style>
</head>
<body>
  <h1>🌐 Buscador Web Limpia</h1>
  <form class="search-box" action="resultados.html" method="GET">
    <input type="text" name="q" placeholder="Buscar experimentos, videos, música..." required>
    <button type="submit">Buscar</button>
  </form>
</body>
</html>
