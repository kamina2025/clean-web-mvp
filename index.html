<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Web Limpia</title>
  <style>
    :root {
      --primary: #0070f3;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 2rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: #000;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    input[type="text"] {
      flex: 1;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.btn-search {
      padding: 1rem 1.5rem;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Banner CTA Creadores */
    .creator-banner {
      margin-top: 3rem;
      background: var(--card-bg);
      border: 1px dashed var(--accent);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .creator-banner p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .btn-cta {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      display: inline-block;
      transition: transform 0.2s;
    }

    .btn-cta:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <a href="registrador-creador.html" class="nav-btn">⚡ Publicar Sitio</a>
  </header>

  <main>
    <div class="logo">Web Limpia Search</div>
    <p class="subtitle">Navegación ética, privada y sin publicidad invasiva</p>

    <form action="resultados.html" method="GET" class="search-box">
      <input type="text" name="q" placeholder="Prueba buscando musica, video o galeria" required>
      <button type="submit" class="btn-search">Buscar</button>
    </form>

    <div class="creator-banner">
      <h3>🚀 ¿Tienes un sitio web o creas contenido?</h3>
      <p>Monetiza de forma directa con micropagos en Nano (XNO) sin anuncios ni rastreo. Genera tu manifiesto e indexa tu página en minutos.</p>
      <a href="registrador-creador.html" class="btn-cta">➕ Indexar mi página ahora</a>
    </div>
  </main>

</body>
</html>
